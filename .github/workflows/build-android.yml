name: Build Android App (.aab & .apk)

on:
  workflow_dispatch:
  push:
    branches:
      - production
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Signed Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p release-out
          if [ -z "$STORE_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is required."
            exit 1
          fi
          ALIAS="creativebydrshakil"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring existing upload keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/creativebydrshakil-upload.jks
          else
            echo "Generating new upload keystore..."
            keytool -genkeypair -v \
              -keystore android/creativebydrshakil-upload.jks \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=Dr. Shakil, OU=Medical Education, O=Creative By Dr. Shakil, L=Dhaka, ST=Dhaka, C=BD"
          fi

          SHA256_FP=$(keytool -list -v -keystore android/creativebydrshakil-upload.jks -alias "$ALIAS" -storepass "$STORE_PASS" | grep -i "SHA256:" | sed 's/.*SHA256: //')
          SHA1_FP=$(keytool -list -v -keystore android/creativebydrshakil-upload.jks -alias "$ALIAS" -storepass "$STORE_PASS" | grep -i "SHA1:" | sed 's/.*SHA1: //')

          cat <<EOF > release-out/certificate-fingerprints.txt
          Package Name (Application ID): com.creativebydrshakil.app
          Key Alias:                     $ALIAS
          SHA-256 Certificate Fingerprint:
          $SHA256_FP
          SHA-1 Certificate Fingerprint:
          $SHA1_FP
          EOF

      - name: Build Signed Release AAB (Google Play Store) & APK (Direct Install)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: "creativebydrshakil-upload.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "creativebydrshakil"
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Package Release Deliverables
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab release-out/creativebydrshakil-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk release-out/creativebydrshakil-release.apk
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp android/app/build/outputs/mapping/release/mapping.txt release-out/mapping.txt
          fi
          cp store-assets/android/play-store-icon-512x512.png release-out/play-store-icon-512x512.png
          cp store-assets/android/feature-graphic-1024x500.png release-out/feature-graphic-1024x500.png
          ls -lh release-out/

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creativebydrshakil-android-release
          path: release-out/*
          retention-days: 90

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-out/creativebydrshakil-release.aab
            release-out/creativebydrshakil-release.apk
            release-out/mapping.txt
            release-out/play-store-icon-512x512.png
            release-out/feature-graphic-1024x500.png
