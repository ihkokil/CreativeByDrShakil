name: Nightly Supabase DB Synchronization

on:
  schedule:
    # 22:00 UTC = 04:00 AM BST (End of the current day)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync-databases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node Version
        run: node --version

      - name: Install Dependencies
        run: npm ci

      - name: Run DB Sync Script
        env:
          CI: true

          # Source DB (The Primary Backup DB)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # The 5 Target Read Replicas
          SUPABASE_URL_1: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_SERVICE_ROLE_KEY_1: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_1 }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_SERVICE_ROLE_KEY_2: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
          SUPABASE_URL_3: ${{ secrets.SUPABASE_URL_3 }}
          SUPABASE_SERVICE_ROLE_KEY_3: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_3 }}
          SUPABASE_URL_4: ${{ secrets.SUPABASE_URL_4 }}
          SUPABASE_SERVICE_ROLE_KEY_4: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_4 }}
          SUPABASE_URL_5: ${{ secrets.SUPABASE_URL_5 }}
          SUPABASE_SERVICE_ROLE_KEY_5: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_5 }}
        run: node scripts/sync-databases.js